name: ci

on: [push]
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Bootstrap poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.8.5
      - name: Install dependencies
        run: poetry install
      # Lint gate covers the hand-maintained paths listed in .fernignore
      # (plus tests and examples); Fern-generated code is excluded.
      - name: Ruff lint
        run: |
          poetry run ruff check \
            src/elevenlabs/client.py \
            src/elevenlabs/conversational_ai/conversation.py \
            src/elevenlabs/conversational_ai/default_audio_interface.py \
            src/elevenlabs/realtime_tts.py \
            src/elevenlabs/play.py \
            src/elevenlabs/webhooks_custom.py \
            src/elevenlabs/music_custom.py \
            src/elevenlabs/speech_to_text_custom.py \
            src/elevenlabs/url_utils.py \
            src/elevenlabs/realtime \
            src/elevenlabs/speech_engine \
            src/elevenlabs/speech_engine_custom.py \
            tests \
            examples

  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Bootstrap poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.8.5
      - name: Install dependencies
        run: |
          poetry install
          poetry run pip install fastapi uvicorn
      - name: Compile
        run: poetry run mypy .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.8.5
      - name: Install dependencies
        run: |
          poetry install
      - name: Verify types
        run: poetry run python tests/verify_types.py
      - name: Test
        run: poetry run pytest . --cov=src/elevenlabs --cov-report=term --cov-report=xml
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # Coverage gate scoped to the hand-maintained paths listed in .fernignore;
      # Fern-generated code is reported above but not gated.
      - name: Enforce coverage threshold (hand-maintained code)
        run: |
          poetry run coverage report --fail-under=65 --include="src/elevenlabs/client.py,src/elevenlabs/conversational_ai/conversation.py,src/elevenlabs/conversational_ai/default_audio_interface.py,src/elevenlabs/realtime_tts.py,src/elevenlabs/play.py,src/elevenlabs/webhooks_custom.py,src/elevenlabs/music_custom.py,src/elevenlabs/speech_to_text_custom.py,src/elevenlabs/url_utils.py,src/elevenlabs/realtime/*,src/elevenlabs/speech_engine/*,src/elevenlabs/speech_engine_custom.py"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  examples:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Bootstrap poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.8.5
      - name: Install dependencies
        run: |
          poetry install
          poetry run pip install fastapi uvicorn
      - name: Compile examples
        run: poetry run python -m compileall -q examples
      - name: Import-check examples
        run: poetry run python examples/check_imports.py
      # Runnable-smoke tier: executes examples end-to-end against a local mock API
      - name: Run examples against local mock server
        run: poetry run python examples/run_smoke.py

  publish:
    needs: [lint, compile, test, examples]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: pypi-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Bootstrap poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.8.5
      - name: Install dependencies
        run: poetry install
      - name: Build package
        run: poetry build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
